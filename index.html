<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIOOO ♥</title>

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at top, #0f0f25, #120010);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #fff;
        }

        .contenido{
            text-align: center;
            width: 90%;
            max-width: 420px;
        }

        h1{
            color: #3666ff;
            font-size: 2.1rem;
            margin-bottom: 0.5rem;
        }

        h2{
            font-size: 1.5rem;
            margin-top: 2rem;
            margin-bottom: 0.3rem;
        }

        .frase{
            margin-top: 0.4rem;
            opacity: 0.85;
        }

        hr{
            border: none;
            border-top: 1px solid rgba(255,255,255,0.8);
            width: 70%;
            margin: 0.3rem auto 1rem auto;
        }

        /* Corazón centrado */
        .heart-wrapper{
            margin-top: 1.5rem;
        }

        .heart{
            position: relative;
            width: 160px;
            height: 160px;
            background: #ff002b;
            transform: rotate(45deg);
            margin: 0 auto;
            box-shadow: 0 0 60px rgba(242,0,68,0.9);
            animation: palpitar 1.1s infinite;
        }

        .heart::before,
        .heart::after{
            content: "";
            position: absolute;
            width: 160px;
            height: 160px;
            background: #ff002b;
            border-radius: 50%;
            box-shadow: 0 0 60px rgba(242,0,68,0.9);
        }

        .heart::before{
            left: -80px;
        }

        .heart::after{
            top: -80px;
        }

        @keyframes palpitar{
            0%   { transform: rotate(45deg) scale(1); }
            30%  { transform: rotate(45deg) scale(1.12); }
            60%  { transform: rotate(45deg) scale(1); }
            100% { transform: rotate(45deg) scale(0.96); }
        }

        /* Ajuste para móvil */
        @media (max-width: 480px){
            h1{ font-size: 1.7rem; }
            h2{ font-size: 1.3rem; }

            .heart{
                width: 135px;
                height: 135px;
            }

            .heart::before,
            .heart::after{
                width: 135px;
                height: 135px;
            }

            .heart::before{
                left: -67.5px;
            }

            .heart::after{
                top: -67.5px;
            }
        }
    </style>
</head>
<body>
    <div class="contenido">
        <h1>¡GIOOO!</h1>
        <hr>
        <div class="heart-wrapper">
            <div class="heart"></div>
        </div>
        <h2>Giovanna Dávila</h2>
        <hr>
        <p class="frase">Eres mi todo</p>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIOOO ♥</title>

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at top, #0f0f25, #120010);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #fff;
        }

        .contenido{
            text-align: center;
            width: 90%;
            max-width: 420px;
        }

        h1{
            color: #3666ff;
            font-size: 2.1rem;
            margin-bottom: 0.5rem;
        }

        h2{
            font-size: 1.5rem;
            margin-top: 2.5rem;
            margin-bottom: 0.3rem;
        }

        .frase{
            margin-top: 0.4rem;
            opacity: 0.85;
        }

        hr{
            border: none;
            border-top: 1px solid rgba(255,255,255,0.8);
            width: 70%;
            margin: 0.3rem auto 1rem auto;
        }

        /* Contenedor del corazón (espacios arriba/abajo) */
        .heart-wrapper{
            margin-top: 3rem;    /* baja el corazón para que no tape "GIOOO" */
            margin-bottom: 2rem; /* separa del texto de abajo */
        }

        /* CORAZÓN CLÁSICO Y SIMÉTRICO */
        .heart{
            position: relative;
            width: 150px;
            height: 150px;
            background: #ff002b;
            transform: rotate(-45deg);          /* ojo: -45, no 45 */
            margin: 0 auto;
            box-shadow: 0 0 60px rgba(242,0,68,0.9);
            animation: palpitar 1.1s infinite;
        }

        .heart::before,
        .heart::after{
            content: "";
            position: absolute;
            width: 150px;
            height: 150px;
            background: #ff002b;
            border-radius: 50%;
            box-shadow: 0 0 60px rgba(242,0,68,0.9);
        }

        /* círculo de arriba */
        .heart::before{
            top: -75px;   /* la mitad de la altura en negativo */
            left: 0;
        }

        /* círculo de la izquierda */
        .heart::after{
            left: 75px;   /* la mitad del ancho hacia la derecha */
            top: 0;
        }

        @keyframes palpitar{
            0%   { transform: rotate(-45deg) scale(1); }
            30%  { transform: rotate(-45deg) scale(1.12); }
            60%  { transform: rotate(-45deg) scale(1); }
            100% { transform: rotate(-45deg) scale(0.96); }
        }

        /* Ajuste para móvil */
        @media (max-width: 480px){
            h1{ font-size: 1.7rem; }
            h2{ font-size: 1.3rem; }

            .heart{
                width: 130px;
                height: 130px;
            }

            .heart::before,
            .heart::after{
                width: 130px;
                height: 130px;
            }

            .heart::before{
                top: -65px;
            }

            .heart::after{
                left: 65px;
            }

            .heart-wrapper{
                margin-top: 2.5rem;
                margin-bottom: 1.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="contenido">
        <h1>¡GIOOO!</h1>
        <hr>
        <div class="heart-wrapper">
            <div class="heart"></div>
        </div>
        <h2>Giovanna Dávila</h2>
        <hr>
        <p class="frase">Eres mi todo</p>
    </div>
</body>
</html>
